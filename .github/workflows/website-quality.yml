name: Website Quality

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main
      - Guilherme_Grancho_PRs
  push:
    branches:
      - Guilherme_Grancho
      - main

jobs:
  code-formatting-linting:
    name: Code Formatting and Linting
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.action != 'closed' || github.event.pull_request.merged == true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint checks
        run: npx eslint . --ext .js,.jsx,.ts,.tsx --max-warnings=0

  american-english:
    name: American English Check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.action != 'closed' || github.event.pull_request.merged == true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate website copy uses American English
        run: npm run check:american-english

  vercel-build:
    name: Vercel Build Check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.action != 'closed' || github.event.pull_request.merged == true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production build
        run: npm run ci:vercel-build
